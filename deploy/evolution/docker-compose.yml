# Evolution API atrás de um nginx no host, que termina o TLS.
#
# A API publica só no loopback (127.0.0.1:8080): o nginx alcança, a internet
# não. A apikey dá controle total de todos os WhatsApp conectados, então ela
# nunca deve trafegar em HTTP puro.
#
# Ver nginx.conf ao lado — inclusive `proxy_buffering off`, sem o qual o QR
# code fica preso no buffer e chega expirado.

services:
  api:
    # Versão fixa de propósito: `latest` aponta pra builds de release candidate.
    # Multi-arch — o mesmo tag serve amd64 e arm64 (Ampere da Oracle).
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: always
    depends_on:
      - redis
      - postgres
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    # O prefixo 127.0.0.1 é obrigatório: "8080:8080" puro abriria a API direto
    # pra internet, furando o TLS do nginx.
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - evolution-net

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --port 6379 --appendonly yes
    volumes:
      - evolution_redis:/data
    networks:
      evolution-net:
        aliases:
          - evolution-redis

  postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      evolution-net:
        aliases:
          - evolution-postgres

volumes:
  evolution_instances:
  evolution_redis:
  postgres_data:

networks:
  evolution-net:
    name: evolution-net
    driver: bridge

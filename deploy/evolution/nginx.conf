# nginx do host, na frente do Evolution API.
#
# Instalar em /etc/nginx/sites-available/evolution e trocar SEU-IP pelo IP
# público da VM. Depois:
#
#   sudo ln -s /etc/nginx/sites-available/evolution /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d SEU-IP.nip.io
#
# O certbot reescreve este bloco para 443, adiciona o certificado e configura a
# renovação automática. Não edite as linhas que ele inserir.

server {
    listen 80;
    listen [::]:80;

    # nip.io resolve qualquer IP embutido no nome, sem registrar domínio:
    # 129.153.10.20.nip.io -> 129.153.10.20. É o que permite ter certificado
    # do Let's Encrypt — ele não emite para endereço IP.
    server_name SEU-IP.nip.io;

    # Envio de mídia pelas campanhas.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Obrigatório: /instance/connect/{instance} devolve o QR code em
        # stream. Com buffer, o código só chega depois de expirado.
        proxy_buffering off;
        proxy_cache off;

        # As sessões do WhatsApp ficam com conexão aberta por longos períodos.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

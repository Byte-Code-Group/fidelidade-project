# Build scripts nativos não necessários para dev/build aqui (next dev/build
# funcionam sem compilá-los). false = decisão explícita de não executar o build,
# o que satisfaz o gate de supply-chain do pnpm desta máquina.
allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false
  cypress: true

# Versões corrigidas de dependências transitivas com advisory (pnpm audit).
overrides:
  "@xmldom/xmldom@<0.8.15": "^0.8.15"
  "browserslist@<4.28.7": "^4.28.7"
  "source-map-js@<1.2.2": "^1.2.2"
  "baseline-browser-mapping@<2.11.0": "^2.11.0"
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=2 <5.0.12": "^5.0.12"
  "js-yaml@>=4 <4.3.2": "^4.3.2"
  "nanoid@<3.3.18": "^3.3.18"
  "postcss@<8.5.23": "^8.5.23"
  "minimatch@>=10 <11.0.1": "^11.0.1"
